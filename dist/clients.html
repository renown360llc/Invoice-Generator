<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="/invoices/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - Invoice Generator Pro</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <style>
        body {
            display: none;
        }

        /* Status badges come from the shared component in variables.css */

        /* Modal + form (mirrors the Consultants page conventions) */
        body.modal-open {
            overflow: hidden;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            animation: modalOverlayIn 0.2s ease-out;
        }

        .modal.is-open {
            display: flex;
        }

        .modal-content {
            width: min(720px, 100%);
            max-height: min(92vh, 760px);
            background: #ffffff;
            border: 1px solid var(--surface-glass-border);
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.2);
            overflow: hidden;
            transform: translateY(16px) scale(0.98);
            opacity: 0;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .modal.is-open .modal-content {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.5rem 1.75rem 1.125rem;
            border-bottom: 1px solid var(--surface-border-subtle);
            background: linear-gradient(180deg, #fff8f6 0%, #ffffff 100%);
        }

        .modal-title {
            font-size: 1.625rem;
            line-height: 1.15;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .modal-subtitle {
            margin-top: 0.25rem;
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .modal-close {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            border: 1px solid var(--surface-glass-border);
            background: #ffffff;
            font-size: 1.75rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
            border-color: #d1d5db;
            background: #f9fafb;
        }

        .modal-body {
            padding: 1.5rem 1.75rem 1.625rem;
            overflow-y: auto;
            max-height: calc(92vh - 110px);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem 1.125rem;
        }

        .form-grid-full {
            grid-column: 1 / -1;
        }

        .form-field {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .form-field__label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }

        .form-field__required {
            color: var(--primary);
        }

        .form-field__input,
        .form-field__select {
            width: 100%;
            height: 42px;
            border: 1px solid var(--surface-glass-border);
            border-radius: 10px;
            background: #ffffff;
            padding: 0 0.875rem;
            font-size: 0.875rem;
            color: var(--text-primary);
            font-family: var(--font-sans);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-field__input:hover,
        .form-field__select:hover {
            border-color: #d1d5db;
        }

        .form-field__input:focus,
        .form-field__select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 74, 0.12);
        }

        .form-field__input::placeholder {
            color: var(--text-tertiary);
        }

        .form-field__error {
            font-size: 0.75rem;
            color: #dc2626;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.375rem;
            padding-top: 1.125rem;
            border-top: 1px solid var(--surface-border-subtle);
        }

        .modal-actions .btn {
            height: 42px;
            min-width: 138px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .modal-actions .btn--outline {
            min-width: 112px;
        }

        #clientForm {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        @keyframes modalOverlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .modal { padding: 0.75rem; }

            .modal-content {
                max-height: calc(100vh - 1.5rem);
                border-radius: 16px;
            }

            .modal-header { padding: 1.125rem 1rem 0.875rem; }
            .modal-title { font-size: 1.25rem; }

            .modal-body {
                padding: 1rem;
                max-height: calc(100vh - 132px);
            }

            .form-grid { grid-template-columns: 1fr; }
            .modal-actions { flex-direction: column-reverse; }
            .modal-actions .btn { width: 100%; }
        }
    </style>
  <script type="module" crossorigin src="/invoices/assets/clients-CY6vF6Cj.js"></script>
  <link rel="modulepreload" crossorigin href="/invoices/assets/config-c-jMUxvT.js">
  <link rel="modulepreload" crossorigin href="/invoices/assets/auth-De7W24vl.js">
  <link rel="modulepreload" crossorigin href="/invoices/assets/utils-C_5o-oWL.js">
  <link rel="modulepreload" crossorigin href="/invoices/assets/layout-kYLeMcut.js">
  <link rel="modulepreload" crossorigin href="/invoices/assets/searchable-select-iRBMfQbA.js">
  <link rel="modulepreload" crossorigin href="/invoices/assets/audit-trail-YMdFfTFf.js">
  <link rel="modulepreload" crossorigin href="/invoices/assets/clients-Cu--2_jv.js">
  <link rel="modulepreload" crossorigin href="/invoices/assets/invoice-email-Cfskoyhs.js">
  <link rel="modulepreload" crossorigin href="/invoices/assets/access-control-BzQDlZig.js">
  <link rel="stylesheet" crossorigin href="/invoices/assets/layout-B4nm2RMD.css">
  <link rel="stylesheet" crossorigin href="/invoices/assets/dashboard-Cn_DQ6AX.css">
  <link rel="stylesheet" crossorigin href="/invoices/assets/mobile-RQyqJNrw.css">
</head>

<body>
    <!-- Navigation injected by layout.js -->

    <main class="dashboard">
        <div class="dashboard__container">
            <!-- Header -->
            <div class="dashboard__header invoice-header">
                <div class="invoice-header__content">
                    <h1 class="dashboard__title">Clients</h1>
                    <p class="dashboard__subtitle">Your standalone client registry — reuse details across invoices</p>
                </div>
                <div class="invoice-header__actions">
                    <button id="addClientBtn" class="btn btn--primary">
                        <svg class="btn-icon" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                                clip-rule="evenodd" />
                        </svg>
                        <span class="btn-text">New Client</span>
                    </button>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="search-box" style="margin-bottom: 1.5rem;">
                <svg class="search-box__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="search" id="searchInput" class="form-field__input" placeholder="Search clients by name, company, email…">
            </div>

            <!-- Table -->
            <div class="table-container">
                <table class="table" id="clientsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Company</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="clientsBody">
                        <tr><td><div class="skeleton-line" style="width:70%"></div></td><td><div class="skeleton-line" style="width:60%"></div></td><td><div class="skeleton-line" style="width:80%"></div></td><td><div class="skeleton-line" style="width:50%"></div></td><td><div class="skeleton-line" style="width:55%"></div></td><td><div class="skeleton-line" style="width:65%"></div></td></tr>
                        <tr><td><div class="skeleton-line" style="width:55%"></div></td><td><div class="skeleton-line" style="width:75%"></div></td><td><div class="skeleton-line" style="width:65%"></div></td><td><div class="skeleton-line" style="width:45%"></div></td><td><div class="skeleton-line" style="width:55%"></div></td><td><div class="skeleton-line" style="width:65%"></div></td></tr>
                        <tr><td><div class="skeleton-line" style="width:65%"></div></td><td><div class="skeleton-line" style="width:55%"></div></td><td><div class="skeleton-line" style="width:75%"></div></td><td><div class="skeleton-line" style="width:50%"></div></td><td><div class="skeleton-line" style="width:55%"></div></td><td><div class="skeleton-line" style="width:65%"></div></td></tr>
                        <tr><td><div class="skeleton-line" style="width:60%"></div></td><td><div class="skeleton-line" style="width:65%"></div></td><td><div class="skeleton-line" style="width:70%"></div></td><td><div class="skeleton-line" style="width:48%"></div></td><td><div class="skeleton-line" style="width:55%"></div></td><td><div class="skeleton-line" style="width:65%"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Client Form Modal -->
    <div id="clientModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 class="modal-title" id="modalTitle">Add New Client</h3>
                    <p class="modal-subtitle">Store reusable client contact and billing details.</p>
                </div>
                <button class="modal-close" id="closeModalBtn" aria-label="Close modal">&times;</button>
            </div>

            <form id="clientForm">
                <div class="modal-body">
                    <input type="hidden" id="clientId">
                    <div class="form-grid">
                        <div class="form-field form-grid-full">
                            <label class="form-field__label">Client Name <span class="form-field__required">*</span></label>
                            <input type="text" id="name" class="form-field__input" required placeholder="e.g. Acme Corp">
                            <div id="nameError" class="form-field__error"></div>
                        </div>

                        <div class="form-field">
                            <label class="form-field__label">Company</label>
                            <input type="text" id="company" class="form-field__input" placeholder="e.g. Acme Holdings LLC">
                        </div>

                        <div class="form-field">
                            <label class="form-field__label">Status <span class="form-field__required">*</span></label>
                            <select id="status" class="form-field__select" required>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label class="form-field__label">Email</label>
                            <input type="email" id="email" class="form-field__input" placeholder="accounts@acme.com">
                            <div id="emailError" class="form-field__error"></div>
                        </div>

                        <div class="form-field">
                            <label class="form-field__label">Phone</label>
                            <input type="tel" id="phone" class="form-field__input" placeholder="+1 (555) 000-0000">
                        </div>

                        <div class="form-field form-grid-full">
                            <label class="form-field__label">Address</label>
                            <textarea id="address" class="form-field__input" rows="3"
                                style="height: auto; padding-top: 0.5rem;"
                                placeholder="Street Address&#10;City, State ZIP"></textarea>
                        </div>

                        <div class="form-field form-grid-full">
                            <label class="form-field__label">Notes</label>
                            <textarea id="notes" class="form-field__input" rows="3"
                                style="height: auto; padding-top: 0.5rem;"
                                placeholder="Internal notes, billing terms, etc."></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-actions" style="margin-top: 0; padding: 1.25rem 1.75rem;">
                    <button type="button" id="cancelBtn" class="btn btn--outline">Cancel</button>
                    <button type="submit" id="saveBtn" class="btn btn--primary">Save Client</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteClientModal"
        style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.5); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center; padding:1.5rem;">
        <div style="background:#fff; border-radius:16px; box-shadow:0 24px 70px rgba(15,23,42,0.2); width:min(440px,100%); padding:2rem;">
            <h3 style="font-size:1.125rem; font-weight:800; color:#111827; margin:0 0 0.5rem;">Delete Client?</h3>
            <p style="font-size:0.8125rem; color:#374151; margin-bottom:1.5rem;">
                You are about to delete <strong id="deleteClientName">—</strong>. This cannot be undone. Existing
                invoices are not affected.
            </p>
            <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
                <button id="deleteCancelBtn" class="btn btn--outline">Cancel</button>
                <button id="deleteConfirmBtn" class="btn" style="background:#dc2626; color:#fff; border:none;">Delete</button>
            </div>
        </div>
    </div>

    <!-- Notification system -->
    <div id="toastContainer" class="toast-container"></div>

</body>

</html>
